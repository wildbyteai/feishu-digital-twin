name: Feature request
description: Propose a reusable capability or configuration seam.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        不要粘贴真实消息、企业数据、凭据、飞书 ID/标识、原始日志或截图。
        优先说明哪些判断应由 AI/Skill 完成，哪些能力可复用官方 lark-cli。
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: Explain the reusable outcome using synthetic examples.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration and privacy impact
      description: What should be configurable, and what data would it access or retain?
    validations:
      required: true
  - type: textarea
    id: official_components
    attributes:
      label: Official component reuse
      description: Which lark-cli command or lark-* Skill can provide the platform capability?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, real messages, Lark IDs, raw logs and company data.
          required: true
