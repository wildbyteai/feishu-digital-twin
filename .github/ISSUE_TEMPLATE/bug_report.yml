name: Bug report
description: Report a reproducible defect using synthetic data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste 真实消息、企业数据、凭据、飞书 ID/标识、原始日志、截图或本机路径。
        请只使用合成身份、合成消息和经过人工检查的脱敏结果码。
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the behavior without business data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps and synthetic configuration only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, real messages, Lark IDs, raw logs and company data.
          required: true
